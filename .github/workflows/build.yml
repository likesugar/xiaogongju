name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vc:
        description: 'versionCode'
        default: '177'
      vn:
        description: 'versionName'
        default: '14.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          CMDLINE=$HOME/cmdline-tools
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p $CMDLINE && unzip -q cmdtools.zip -d $CMDLINE
          yes | $CMDLINE/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK
        env:
          VC: ${{ github.event.inputs.vc || '177' }}
          VN: ${{ github.event.inputs.vn || '14.2' }}
        run: bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaogongju-apk
          path: xiaogongju_v*.apk
