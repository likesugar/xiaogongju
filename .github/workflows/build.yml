name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: 构建 APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x build_ci.sh
          VN="${GITHUB_REF_NAME#v}"
          VC=$((GITHUB_RUN_NUMBER + 118))
          bash build_ci.sh "$VC" "$VN"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: 小工具_v*.apk
