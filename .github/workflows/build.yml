name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vc:
        description: 'versionCode'
        default: '259'
      vn:
        description: 'versionName'
        default: '18.6'

permissions:
  contents: write    # ★ 必须加，否则无法创建 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          CMDLINE=$HOME/cmdline-tools
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p $CMDLINE && unzip -q cmdtools.zip -d $CMDLINE
          yes | $CMDLINE/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build APK
        env:
          VC: ${{ github.event.inputs.vc || '259' }}
          VN: ${{ github.event.inputs.vn || '18.6' }}
        run: bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaogongju-apk
          path: xiaogongju_v*.apk

      # ★ 新增：自动发布到 Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.vn || '14.2' }}-${{ github.run_number }}
          name: xiaogongju v${{ github.event.inputs.vn || '14.2' }} (build ${{ github.run_number }})
          files: xiaogongju_v*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
